name: Refresh Instagram token

# Instagram long-lived tokens expire after 60 days and can be refreshed once
# they are at least 24 hours old. Weekly leaves seven chances before expiry;
# a failure here emails you, and you have weeks to fix it.
#
# Needs a second secret, SECRETS_PAT: a fine-grained GitHub token for this
# repository with "Secrets: Read and write". The built-in GITHUB_TOKEN is not
# allowed to update secrets.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Refresh and store the token
        shell: bash
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          out="$RUNNER_TEMP/ig.token"
          python pipeline/instagram.py refresh --out "$out"
          # The new token is verified by instagram.py before it is written;
          # an empty file must never overwrite a working secret.
          test -s "$out"
          echo "::add-mask::$(cat "$out")"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$out"
          rm -f "$out"
