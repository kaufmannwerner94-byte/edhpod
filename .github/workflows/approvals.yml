name: Approvals

# Every 15 minutes: apply your Telegram taps (approve / reject / notes),
# send previews of posts that need review, and commit the decisions.
# If you approve today's post after 17:00 UTC, it starts "Daily post" so the
# post goes out immediately instead of being skipped.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit approved.json / rejected.json / preview.json
  actions: write    # start "Daily post" for a late approval

concurrency:
  group: approvals
  cancel-in-progress: false

jobs:
  approvals:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check Telegram is configured
        id: configured
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are not set; nothing to do."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.configured.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.configured.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install light dependencies
        if: steps.configured.outputs.ok == 'true'
        run: pip install requests pillow

      - name: Apply taps and commands
        if: steps.configured.outputs.ok == 'true'
        id: poll
        run: python pipeline/telegram_bot.py poll

      - name: Find posts that need a preview
        if: steps.configured.outputs.ok == 'true'
        id: pending
        run: python pipeline/telegram_bot.py pending

      - name: Install render toolchain
        if: steps.configured.outputs.ok == 'true' && steps.pending.outputs.count != '0'
        run: |
          pip install -r pipeline/requirements.txt
          python -m playwright install --with-deps --only-shell chromium

      - name: Render and send previews
        if: steps.configured.outputs.ok == 'true' && steps.pending.outputs.count != '0'
        run: python pipeline/telegram_bot.py send

      - name: Commit decisions
        if: steps.configured.outputs.ok == 'true'
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only decision files. Listed first, because `git add` aborts when a
          # pattern matches nothing (e.g. no approvals yet on the first run).
          changed=$(git status --porcelain --untracked-files=all -- queue \
                    | awk '{print $NF}' | grep -E '/(approved|rejected|preview)\.json$' || true)
          if [ -z "$changed" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git add -A -- $changed
          git commit -m "Approvals via Telegram"
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 10
          done
          exit 1

      # Only after the decisions are safely on GitHub; otherwise the next run
      # sees the same taps again, which is harmless.
      - name: Confirm processed updates to Telegram
        if: steps.configured.outputs.ok == 'true' && steps.commit.outcome == 'success' && steps.poll.outputs.ack_offset != ''
        env:
          OFFSET: ${{ steps.poll.outputs.ack_offset }}
        run: python pipeline/telegram_bot.py ack --offset "$OFFSET"

      - name: Publish a late-approved post now
        if: steps.commit.outcome == 'success' && steps.poll.outputs.post_now != ''
        env:
          GH_TOKEN: ${{ github.token }}
          POST_DATE: ${{ steps.poll.outputs.post_now }}
        run: gh workflow run daily-post.yml --ref "${{ github.ref_name }}" -f date="$POST_DATE" -f dry_run=false

      - name: Report a failure on Telegram
        if: failure() && steps.configured.outputs.ok == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python pipeline/telegram_bot.py notify "🚨 The approvals job failed. Log: $RUN_URL" || true
