<div style="width:1080px;height:1350px;box-sizing:border-box;padding:64px;background:#11131C;color:#F4EFE6;font-family:Inter,sans-serif;display:flex;flex-direction:column;justify-content:space-between;gap:40px">
  <div style="display:flex;flex-direction:row;justify-content:space-between;align-items:center">
    <div style="background:#F2B544;color:#11131C;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;letter-spacing:0.08em;padding:14px 28px;border-radius:999px">CARD OF THE DAY</div>
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:32px;color:#A8ABBD">{{number}}</div>
  </div>

  <div style="display:flex;flex-direction:row;gap:48px;align-items:stretch">
    <img src="{{card_image}}" style="width:480px;height:auto;flex-shrink:0;display:block;align-self:flex-start">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:28px">
      <div data-autofit="34" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:64px;line-height:1.05">{{card_name}}</div>
      <div style="height:3px;background:#2E3245"></div>
      <div style="display:flex;flex-direction:column;gap:6px"><div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:24px;letter-spacing:0.12em;color:#F2B544">ROLE</div><div data-autofit="26" style="font-size:34px;line-height:1.2">{{role}}</div></div>
      <div style="display:flex;flex-direction:column;gap:6px"><div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:24px;letter-spacing:0.12em;color:#F2B544">WORKS IN</div><div data-autofit="26" style="font-size:34px;line-height:1.2">{{works_in}}</div></div>
      <div style="display:flex;flex-direction:column;gap:6px"><div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:24px;letter-spacing:0.12em;color:#F2B544">PRICE</div><div style="font-size:34px;line-height:1.2">{{price}}</div></div>
    </div>
  </div>

  <div data-autofit="30" style="background:#1B1E2B;border-radius:28px;padding:36px;font-size:44px;font-weight:500;line-height:1.2">{{hook}}</div>

  <div style="display:flex;flex-direction:row;justify-content:space-between;align-items:center">
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px">@edhpod</div>
    <div style="font-size:28px;color:#A8ABBD">Swipe for the breakdown →</div>
  </div>
</div>
