<div style="width:1080px;height:1350px;box-sizing:border-box;padding:64px;background:#11131C;color:#F4EFE6;font-family:Inter,sans-serif;display:flex;flex-direction:column;justify-content:space-between;gap:40px">
  <div style="display:flex;flex-direction:row;justify-content:space-between;align-items:center">
    <div style="background:#4FD1B5;color:#11131C;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;letter-spacing:0.08em;padding:14px 28px;border-radius:999px">BUDGET COMBO</div>
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:32px;color:#A8ABBD">{{number}}</div>
  </div>

  <div data-autofit="40" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:76px;line-height:1.05">{{combo_name}}</div>

  <!-- Cards share the row width rather than taking a fixed 272px, so a
       two-card combo gets ~410px each instead of two small cards marooned at
       opposite edges. It also keeps the artist credit on the card readable. -->
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:24px">
<!--SEP:combo_cards-->
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:64px;color:#4FD1B5;flex-shrink:0">+</div>
<!--/SEP-->
<!--REPEAT:combo_cards-->
    <img src="{{image}}" style="flex:1;min-width:0;max-width:420px;height:auto;display:block">
<!--/REPEAT-->
  </div>

  <div style="display:flex;flex-direction:row;gap:40px;align-items:stretch">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:22px;justify-content:center">
<!--REPEAT:steps-->
      <div style="display:flex;flex-direction:row;gap:20px;align-items:center"><div style="width:56px;height:56px;border-radius:28px;background:#4FD1B5;color:#11131C;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0">{{i}}</div><div data-autofit="24" style="font-size:32px;line-height:1.2">{{text}}</div></div>
<!--/REPEAT-->
    </div>
    <!-- Two currencies stacked, not joined by a slash. At 300px wide the
         joined form wraps and strands the slash on a line of its own. -->
    <div style="width:300px;flex-shrink:0;box-sizing:border-box;background:#1B1E2B;border-radius:28px;padding:28px;display:flex;flex-direction:column;justify-content:center;gap:4px">
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:24px;letter-spacing:0.12em;color:#A8ABBD">TOTAL COST</div>
      <div data-autofit="34" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:62px;line-height:1.1;color:#4FD1B5;white-space:nowrap">{{total_usd}}</div>
      <div data-autofit="34" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:62px;line-height:1.1;color:#4FD1B5;white-space:nowrap">{{total_eur}}</div>
    </div>
  </div>

  <div style="display:flex;flex-direction:row;justify-content:space-between;align-items:center">
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px">@edhpod</div>
    <div style="font-size:28px;color:#A8ABBD">Swipe for the decklist →</div>
  </div>
</div>
