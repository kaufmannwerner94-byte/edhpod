<div style="width:1080px;height:1350px;box-sizing:border-box;padding:64px;background:#11131C;color:#F4EFE6;font-family:Inter,sans-serif;display:flex;flex-direction:column;justify-content:space-between;gap:40px">
  <div style="display:flex;flex-direction:row;justify-content:space-between;align-items:center">
    <div style="background:#A78BFA;color:#11131C;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;letter-spacing:0.08em;padding:14px 28px;border-radius:999px">INTRODUCTION</div>
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:32px;color:#A8ABBD">{{number}}</div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:28px;letter-spacing:0.12em;color:#A78BFA">NEW IN</div>
    <div data-autofit="44" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:88px;line-height:1">{{set_name}}</div>
  </div>

  <div style="display:flex;flex-direction:row;gap:48px;align-items:flex-start">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:32px">
      <div data-autofit="30" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:52px;line-height:1.05">{{card_name}}</div>
      <div style="display:flex;flex-direction:column;gap:8px"><div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:24px;letter-spacing:0.12em;color:#A78BFA">WHAT IT DOES</div><div data-autofit="24" style="font-size:34px;line-height:1.25">{{what_it_does}}</div></div>
      <div style="display:flex;flex-direction:column;gap:8px"><div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:24px;letter-spacing:0.12em;color:#A78BFA">BEST HOME</div><div data-autofit="24" style="font-size:34px;line-height:1.25">{{best_home}}</div></div>
      <div style="display:flex;flex-direction:column;gap:8px"><div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:24px;letter-spacing:0.12em;color:#A78BFA">TAKE</div><div data-autofit="24" style="font-size:34px;line-height:1.25">{{take}}</div></div>
    </div>
    <img src="{{card_image}}" style="width:440px;height:auto;flex-shrink:0;display:block;align-self:center">
  </div>

  <div style="display:flex;flex-direction:row;justify-content:space-between;align-items:center">
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px">@edhpod</div>
    <div style="font-size:28px;color:#A8ABBD">Swipe for more from the set →</div>
  </div>
</div>
