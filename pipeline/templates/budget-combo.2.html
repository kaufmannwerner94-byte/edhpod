<div style="width:1080px;height:1350px;box-sizing:border-box;padding:64px;background:#11131C;color:#F4EFE6;font-family:Inter,sans-serif;display:flex;flex-direction:column;justify-content:space-between;gap:40px">
  <div style="display:flex;flex-direction:row;justify-content:space-between;align-items:center">
    <div style="background:#4FD1B5;color:#11131C;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;letter-spacing:0.08em;padding:14px 28px;border-radius:999px">BUDGET COMBO</div>
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:32px;color:#A8ABBD">2 / 3</div>
  </div>

  <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:76px;line-height:1.05">THE DECKLIST</div>

  <!-- The price column is 250px and nowrap. At 140px the dual-currency string
       wrapped onto two lines in every row, which added ~190px to the slide and
       pushed the footer off the bottom. -->
  <div style="display:flex;flex-direction:column;gap:14px">
<!--REPEAT:decklist-->
    <div style="display:flex;flex-direction:row;align-items:center;gap:20px;background:#1B1E2B;border-radius:20px;padding:20px 28px"><div data-autofit="22" style="flex:1;min-width:0;font-size:32px;line-height:1.2">{{name}}</div><div style="font-size:26px;color:#A8ABBD;flex-shrink:0">{{role}}</div><div data-autofit="22" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;color:#4FD1B5;width:250px;text-align:right;flex-shrink:0;white-space:nowrap">{{price}}</div></div>
<!--/REPEAT-->
  </div>

  <div style="display:flex;flex-direction:row;justify-content:space-between;align-items:center;padding:8px 28px">
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:30px;letter-spacing:0.12em;color:#A8ABBD">TOTAL</div>
    <div data-autofit="38" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:64px;line-height:1;color:#4FD1B5;white-space:nowrap">{{total}}</div>
  </div>

  <div style="background:#1B1E2B;border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:10px">
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:26px;letter-spacing:0.12em;color:#4FD1B5">EVEN CHEAPER</div>
    <div data-autofit="26" style="font-size:34px;line-height:1.25">{{swap}}</div>
  </div>

  <div style="display:flex;flex-direction:row;justify-content:space-between;align-items:center">
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px">@edhpod</div>
    <div style="font-size:28px;color:#A8ABBD">Swipe →</div>
  </div>
</div>
