<div style="width:1080px;height:1350px;box-sizing:border-box;padding:64px;background:#11131C;color:#F4EFE6;font-family:Inter,sans-serif;display:flex;flex-direction:column;justify-content:space-between;gap:32px">
  <div style="display:flex;flex-direction:row;justify-content:space-between;align-items:center">
    <div style="background:#F4EFE6;color:#11131C;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;letter-spacing:0.08em;padding:14px 28px;border-radius:999px">WELCOME</div>
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:32px;color:#A8ABBD">@edhpod</div>
  </div>

  <div style="display:flex;flex-direction:row;gap:44px;align-items:center">
    <div style="width:250px;height:250px;flex-shrink:0;box-sizing:border-box;border-radius:125px;border:14px solid #F2B544;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:78px;line-height:1;color:#F2B544">EDH</div>
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:34px;line-height:1;letter-spacing:0.42em;margin-left:0.42em;color:#F4EFE6">POD</div>
    </div>
    <div data-autofit="48" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:72px;line-height:1.04">{{headline}}</div>
  </div>

  <div style="display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;flex-direction:row;gap:26px;align-items:center;background:#1B1E2B;border-radius:24px;padding:24px 30px">
      <div style="width:72px;height:72px;flex-shrink:0;border-radius:36px;border:3px solid #F2B544;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F2B544" stroke-width="2" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2"/></svg></div>
      <div style="display:flex;flex-direction:column;gap:4px"><div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px;color:#F2B544">Card of the Day</div><div data-autofit="24" style="font-size:30px;line-height:1.25">{{cotd}}</div></div>
    </div>
    <div style="display:flex;flex-direction:row;gap:26px;align-items:center;background:#1B1E2B;border-radius:24px;padding:24px 30px">
      <div style="width:72px;height:72px;flex-shrink:0;border-radius:36px;border:3px solid #4FD1B5;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#4FD1B5" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></div>
      <div style="display:flex;flex-direction:column;gap:4px"><div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px;color:#4FD1B5">Budget Combo</div><div data-autofit="24" style="font-size:30px;line-height:1.25">{{combo}}</div></div>
    </div>
    <div style="display:flex;flex-direction:row;gap:26px;align-items:center;background:#1B1E2B;border-radius:24px;padding:24px 30px">
      <div style="width:72px;height:72px;flex-shrink:0;border-radius:36px;border:3px solid #A78BFA;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#A78BFA" stroke-width="2" aria-hidden="true"><path d="M12 3l2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4z"/></svg></div>
      <div style="display:flex;flex-direction:column;gap:4px"><div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px;color:#A78BFA">Introduction</div><div data-autofit="24" style="font-size:30px;line-height:1.25">{{intro}}</div></div>
    </div>
  </div>

  <div style="border-top:2px solid #2E3245;padding-top:26px">
    <div data-autofit="24" style="font-size:24px;line-height:1.4;color:#A8ABBD">{{disclaimer}}</div>
  </div>

  <div style="display:flex;flex-direction:row;justify-content:space-between;align-items:center">
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px">One card. One combo. Every day.</div>
    <div style="font-size:28px;color:#A8ABBD">Commander / EDH</div>
  </div>
</div>
