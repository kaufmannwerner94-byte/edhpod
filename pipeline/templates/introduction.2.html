<div style="width:1080px;height:1350px;box-sizing:border-box;padding:64px;background:#11131C;color:#F4EFE6;font-family:Inter,sans-serif;display:flex;flex-direction:column;justify-content:space-between;gap:40px">
  <div style="display:flex;flex-direction:row;justify-content:space-between;align-items:center">
    <div style="background:#A78BFA;color:#11131C;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;letter-spacing:0.08em;padding:14px 28px;border-radius:999px">INTRODUCTION</div>
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:32px;color:#A8ABBD">2 / 3</div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:28px;letter-spacing:0.12em;color:#A78BFA">MORE FROM</div>
    <div data-autofit="40" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:80px;line-height:1">{{set_name}}</div>
  </div>

  <!-- Three across rather than three stacked rows. Stacked rows only leave
       room for a 150px-wide card, at which point the artist credit baked into
       the image is a smear; columns take the full 952px of usable width and
       give each card roughly double that. -->
  <div style="display:flex;flex-direction:row;gap:28px;align-items:flex-start">
<!--REPEAT:cards-->
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:18px">
      <img src="{{image}}" style="width:100%;height:auto;display:block">
      <div data-autofit="22" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px;line-height:1.1">{{name}}</div>
      <div data-autofit="20" style="font-size:27px;line-height:1.3;color:#C9CCDA">{{take}}</div>
    </div>
<!--/REPEAT-->
  </div>

  <div style="display:flex;flex-direction:row;justify-content:space-between;align-items:center">
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px">@edhpod</div>
    <div style="font-size:28px;color:#A8ABBD">Swipe →</div>
  </div>
</div>
